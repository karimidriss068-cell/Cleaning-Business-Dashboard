<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keystone Clean — Dashboard mock (Titanium & Ice)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Titanium & Ice — values copied from src/config/brand.ts */
:root,[data-theme=dark]{
 --canvas:#0C0F14;--surface:#131820;--raised:#1B222C;--highlight:#273241;--text:#E8EDF3;--muted:#A0ADBE;
 --accent:#8EC5FF;--accent-text:#8EC5FF;--accent2:#7FE3F0;--primary:#8EC5FF;--primary-label:#0C0F14;
 --border:#282D35;--input:#6B7078;--info-soft:#273444;
 --ok:#4CC38A;--ok-soft:#1C3331;--warn:#F0B54A;--warn-soft:#363127;--bad:#F2777A;--bad-soft:#37272E;
 --sidebar:#10141A;--chart2:#C4B8FF;--chart3:#6D7786;
 --glow:rgb(142 197 255/.35);--ambient:rgb(142 197 255/.10);--grid:rgb(232 237 243/.035);--glass-a:.72;
 --hair:color-mix(in oklab,var(--text) 10%,transparent);
}
[data-theme=light]{
 --canvas:#F1F4F8;--surface:#FFFFFF;--raised:#F8FAFC;--highlight:#F6FAFF;--text:#0C0F14;--muted:#595C60;
 --accent:#6A93BE;--accent-text:#465F7D;--accent2:#8982B4;--primary:#557699;--primary-label:#fff;
 --border:#DADDE1;--input:#85888D;--info-soft:#EFF7FF;
 --ok:#25784D;--ok-soft:#E6F3EC;--warn:#8D6315;--warn-soft:#F9F1E3;--bad:#B93D3E;--bad-soft:#FAE9E9;
 --sidebar:#FFFFFF;--chart2:#8982B4;--chart3:#8E9093;
 --glow:rgb(142 197 255/.25);--ambient:rgb(142 197 255/.06);--grid:rgb(12 15 20/.04);--glass-a:.78;
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--text);background:var(--canvas);min-height:100vh;font-size:14px;
 background-image:radial-gradient(900px 500px at 75% -10%,var(--ambient),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
 background-size:auto,48px 48px,48px 48px;transition:background-color .3s}
h1,h2,h3,.disp{font-family:Sora,sans-serif}
.tab{font-variant-numeric:tabular-nums}.mono{font-family:"DM Mono",monospace}
.glass{background:color-mix(in oklab,var(--surface) calc(var(--glass-a)*100%),transparent);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
 border:1px solid var(--hair);box-shadow:inset 0 1px 0 color-mix(in oklab,var(--text) 7%,transparent),0 10px 30px -18px rgb(0 0 0/.6)}
.card{border-radius:10px;padding:20px;position:relative}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* mock toolbar */
.mockbar{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;gap:6px;padding:6px;border-radius:999px}
.mockbar button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted)}
.mockbar button.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 35%,transparent)}
/* frame */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);width:244px;flex-shrink:0;border-radius:14px;display:flex;flex-direction:column;
 background:color-mix(in oklab,var(--sidebar) 80%,transparent)}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;font-family:Sora;font-weight:600;font-size:15px}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(160deg,var(--accent),color-mix(in oklab,var(--accent) 45%,var(--canvas)));box-shadow:0 0 16px -4px var(--glow);color:var(--primary-label);font-size:14px;font-weight:700}
nav{flex:1;overflow:auto;padding:8px 12px}
.sec{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin:10px 0 6px}
.nav{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;width:100%;border-radius:6px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.nav:hover{background:color-mix(in oklab,var(--raised) 50%,transparent);color:var(--text)}
.nav.on{color:var(--text);background:color-mix(in oklab,var(--raised) 70%,transparent);box-shadow:0 0 18px -6px var(--accent),inset 0 0 0 1px color-mix(in oklab,var(--accent) 30%,transparent)}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--glow)}
.nav.on svg{color:var(--accent-text)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.who{border-top:1px solid var(--hair);padding:12px;display:flex;gap:12px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--accent-text);font:600 12px Sora;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 40%,transparent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:12px;z-index:10;margin:12px 12px 0;height:56px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 16px}
.search{flex:1;max-width:420px;height:36px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);background:color-mix(in oklab,var(--canvas) 38%,transparent);border:1px solid var(--hair);font-size:13px}
.kbd{margin-left:auto;font:11px "DM Mono";border:1px solid var(--hair);border-radius:4px;padding:1px 6px}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--hair);font-size:12px}
.seg span{padding:4px 10px;border-radius:999px;color:var(--muted)}.seg span.on{background:var(--raised);color:var(--text)}
.ibtn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--hair);position:relative}
.ibtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow)}
.content{padding:28px 24px 64px;max-width:1400px;width:100%;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.ph .eb{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);margin:0 0 8px}
.ph h1{margin:0;font-size:36px;line-height:40px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:6px 0 0;color:var(--muted)}
.btn{all:unset;cursor:pointer;height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border:1px solid var(--hair);color:var(--text)}
.btn.p{background:var(--primary);color:var(--primary-label);border-color:transparent;box-shadow:0 0 22px -6px var(--glow)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}.g11{grid-template-columns:1fr 1fr}
.kpi .edge{position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--accent) 60%,transparent),transparent)}
.kpi .v{font:500 40px/44px Sora;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--glow);margin:14px 0 10px}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-end}
.delta{display:inline-flex;gap:2px;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px currentColor}
.up{color:var(--ok)}.dn{color:var(--bad)}.hint{color:var(--muted);font-size:13px;margin-left:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}.p-warn{color:var(--warn);background:var(--warn-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-info{color:var(--accent-text);background:var(--info-soft)}.p-mute{color:var(--muted);background:var(--raised)}.p-q{color:var(--chart2);background:color-mix(in oklab,var(--chart2) 14%,transparent)}
table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--hair)}
td{padding:12px;border-bottom:1px solid var(--hair)}tr:last-child td{border-bottom:0}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.ch h3{margin:0;font-size:16px;font-weight:600}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.ch a{color:var(--accent-text);font-size:13px;font-weight:600;text-decoration:none}
.bar{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 60%,transparent),var(--accent));box-shadow:0 0 12px var(--glow)}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}.li:last-child{border:0}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--raised);color:var(--accent-text);flex-shrink:0}
.sub{color:var(--muted);font-size:12.5px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto}
.col{border-radius:10px;padding:12px;min-height:420px}.col h4{margin:4px 4px 12px;display:flex;justify-content:space-between;font-size:13px}
.lead{border-radius:8px;padding:12px;margin-bottom:10px;background:color-mix(in oklab,var(--raised) 75%,transparent);border:1px solid var(--hair)}
.lead b{display:block;margin-bottom:4px}.lead .m{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:60px repeat(5,1fr);font-size:12px}.cal div{border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);min-height:52px;padding:4px;position:relative}
.ev{border-radius:6px;padding:6px 8px;font-size:12px;border-left:3px solid var(--accent);background:var(--info-soft);margin-bottom:4px}
.ev.q{border-color:var(--chart2);background:color-mix(in oklab,var(--chart2) 14%,transparent)}.ev.g{border-color:var(--ok);background:var(--ok-soft)}
.mobtabs{display:none}
/* phone */
body.phone{display:flex;justify-content:center;padding:24px 0;background-color:color-mix(in oklab,var(--canvas) 70%,#000)}
body.phone .app{width:390px;min-height:844px;height:844px;overflow:auto;border-radius:36px;border:1px solid var(--hair);background:var(--canvas);position:relative;
 background-image:radial-gradient(400px 300px at 80% -10%,var(--ambient),transparent 70%)}
body.phone .side{display:none}
body.phone .top{margin:10px 10px 0;top:10px}body.phone .search,body.phone .seg{display:none}
body.phone .content{padding:20px 14px 100px}
body.phone .ph h1{font-size:28px;line-height:32px}
body.phone .g4{grid-template-columns:1fr 1fr}body.phone .g3,body.phone .g2,body.phone .g11{grid-template-columns:1fr}
body.phone .kpi .v{font-size:28px;line-height:32px}body.phone .kpi svg{display:none}
body.phone .kan{grid-template-columns:repeat(5,82%);scroll-snap-type:x mandatory}body.phone .col{scroll-snap-align:start}
body.phone .hide-ph{display:none}
body.phone .mobtabs{display:flex;position:sticky;bottom:10px;margin:0 10px;border-radius:16px;height:62px;justify-content:space-around;align-items:center;z-index:20}
.mobtabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px}
.mobtabs button.on{color:var(--accent-text)}.mobtabs svg{width:20px;height:20px}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Analytics layer ===== */
.ana{margin-top:28px}.ana-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ana-h h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.ana-h h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.rng{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--hair)}
.rng button,.atabs button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:12px;color:var(--muted);transition:all .2s}
.rng button.on,.atabs button.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 35%,transparent)}
.atabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--hair);padding-bottom:10px}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.mk button{all:unset;cursor:pointer;box-sizing:border-box;border-radius:10px;padding:14px;border:1px solid var(--hair);background:color-mix(in oklab,var(--raised) 45%,transparent);transition:all .2s}
.mk button:hover{border-color:color-mix(in oklab,var(--accent) 40%,transparent)}
.mk button.on{border-color:var(--accent);box-shadow:0 0 20px -8px var(--glow),inset 0 0 0 1px color-mix(in oklab,var(--accent) 40%,transparent)}
.mk .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mk .n{font:500 24px/30px Sora;margin-top:6px;font-variant-numeric:tabular-nums}.mk .d{font-size:12px;margin-top:2px}
.ag{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
body.phone .ag>*{grid-column:span 12}
.ct{font-size:13px;font-weight:600;margin-bottom:4px}.cs{font-size:12px;color:var(--muted);margin-bottom:14px}
.ch-svg [data-tip]{cursor:crosshair;transition:opacity .2s}.ch-svg [data-tip]:hover{opacity:1!important;filter:drop-shadow(0 0 6px var(--accent))}
.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-origin:bottom;transform-box:fill-box;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleY(0)}}
.growx{transform-origin:left;transform-box:fill-box;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}@keyframes growx{from{transform:scaleX(0)}}
#tip{position:fixed;z-index:99;pointer-events:none;padding:7px 10px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap;
 background:color-mix(in oklab,var(--surface) 92%,transparent);border:1px solid color-mix(in oklab,var(--accent) 35%,transparent);box-shadow:0 8px 24px -8px rgb(0 0 0/.5);backdrop-filter:blur(12px)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hm{display:grid;gap:3px}.hm div{border-radius:4px;aspect-ratio:2.8;cursor:crosshair;transition:transform .15s}.hm div:hover{transform:scale(1.12);outline:1px solid var(--accent)}
.hm .hl{aspect-ratio:auto;font-size:10.5px;color:var(--muted);display:flex;align-items:center;background:none!important;cursor:default}.hm .hl:hover{transform:none;outline:0}
.ring{display:flex;gap:16px;align-items:center}
.ins{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:color-mix(in oklab,var(--info-soft) 70%,transparent);font-size:13px;margin-bottom:10px}
.ins b{color:var(--accent-text)}
.fn-row{display:grid;grid-template-columns:110px 1fr 64px;gap:12px;align-items:center;margin-bottom:10px;font-size:13px}
body.phone .fn-row{grid-template-columns:80px 1fr 48px}
</style>
</head>
<body>
<div class="mockbar glass">
 <button data-dev="desktop" class="on">Desktop</button><button data-dev="phone">Phone</button>
 <span style="width:1px;background:var(--hair)"></span>
 <button data-th="dark" class="on">Dark</button><button data-th="light">Light</button>
</div>
<div class="app">
 <aside class="side glass">
  <div class="brand"><span class="mark">K</span>Keystone Clean</div>
  <nav id="nav"></nav>
  <div class="who"><span class="av">KI</span><div><div style="font-weight:500">Karim Idriss</div><div class="sub">Owner</div></div></div>
 </aside>
 <div class="main">
  <header class="top glass">
   <div class="search">⌕ Search or jump to… <span class="kbd">⌘K</span></div>
   <div style="flex:1"></div>
   <div class="seg"><span>Vault</span><span class="on">Titanium</span><span>Ocean</span><span>Midnight</span></div>
   <div class="ibtn" title="Notifications">🔔︎<span class="dot"></span></div>
  </header>
  <main class="content" id="view"></main>
  <div class="mobtabs glass" id="tabs"></div>
 </div>
</div>
<script>
const I={
 gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
 kanban:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v9"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6M16 12h-6M13 16h-3"/>',
 wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
 trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
 msg:'<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
 mega:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
 flow:'<rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 7 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 1.18 14H1a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 2.82 1.17"/>'
};
const svg=(k,s=18)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const NAV=[["command","Command Center","Home","gauge","Operate",1],["leads","Leads & Pipeline","Leads","kanban","Operate",1],["schedule","Schedule","Schedule","cal","Operate",1],["crews","Crews","Crews","users","Operate"],

function donut(parts,center,sub){const tot=parts.reduce((a,p)=>a+p[1],0);let a=-90;const R=54,C=2*Math.PI*R;let off=0;

 return `<div class="ring"><svg class="ch-svg" width="140" height="140" viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--raised)" stroke-width="14"/>${segs}<text x="70" y="70" text-anchor="middle" font-family="Sora" font-size="22" fill="var(--text)">${center}</text><text x="70" y="88" text-anchor="middle" font-size="10" fill="var(--muted)">${sub}</text></svg>
 <div style="flex:1">${parts.map((p,k)=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--hair)"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${p[2]||COLS[k]};margin-right:8px"></i>${p[0]}</span><span class="tab sub">${Math.round(p[1]/tot*100)}%</span></div>`).join('')}</div></div>`}
function gauge(pct,label,c='var(--accent)'){const R=46,C=Math.PI*R;return `<svg class="ch-svg" width="120" height="74" viewBox="0 0 120 74"><path d="M14 64a46 46 0 0 1 92 0" fill="none" stroke="var(--raised)" stroke-width="10" stroke-linecap="round"/><path d="M14 64a46 46 0 0 1 92 0" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" style="animation:none;filter:drop-shadow(0 0 6px ${c})" data-tip="${label}: ${pct}%"/><text x="60" y="58" text-anchor="middle" font-family="Sora" font-size="20" fill="var(--text)">${pct}%</text></svg><div class="sub" style="text-align:center">${label}</div>`}
function heat(rows,cols,vals,{u='%',lo='var(--raised)',hi='var(--accent)'}={}){const mx=Math.max(...vals.flat());
 return `<div class="hm" style="grid-template-columns:64px repeat(${cols.length},1fr)"><div class="hl"></div>${cols.map(c=>`<div class="hl" style="justify-content:center">${c}</div>`).join('')}${rows.map((r,i)=>`<div class="hl">${r}</div>`+cols.map((c,j)=>{const v=vals[i][j];const t=v/mx;const col=v>=92&&u=='%'?'var(--warn)':hi;return `<div style="background:color-mix(in oklab,${col} ${Math.round(12+t*78)}%,${lo})" data-tip="<b>${r} · ${c}</b><br>${v}${u}"></div>`}).join('')).join('')}</div>`}
function hbars(items,u=''){const mx=Math.max(...items.map(i=>i[1]));return items.map((it,k)=>`<div class="fn-row"><span>${it[0]}</span><div class="bar" style="height:10px" data-tip="<b>${it[0]}</b><br>${fmt(it[1],u)}${it[3]?' · '+it[3]:''}"><i class="growx" style="width:${it[1]/mx*100}%;${it[2]?'background:'+it[2]:''}"></i></div><span class="tab sub" style="text-align:right">${fmt(it[1],u)}</span></div>`).join('')}
function funnel(st){const w=760,h=st.length*46,mx=st[0][1];return `<svg class="ch-svg" viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${st.map((s,i)=>{const bw=s[1]/mx*(w-260),x=(w-260-bw)/2+130;const conv=i?Math.round(s[1]/st[i-1][1]*100)+'% from prev':'';
 return `<text x="0" y="${i*46+27}" font-size="13" fill="var(--text)">${s[0]}</text><rect class="growx" x="${x}" y="${i*46+6}" width="${bw}" height="32" rx="6" fill="color-mix(in oklab,var(--accent) ${90-i*14}%,var(--chart2))" opacity=".9" data-tip="<b>${s[0]}</b><br>${s[1]} leads<br>${conv||'top of funnel'}"/><text x="${w-120}" y="${i*46+27}" font-size="13" fill="var(--text)" font-family="Sora">${s[1]}</text><text x="${w-70}" y="${i*46+27}" font-size="11" fill="var(--muted)">${i?Math.round(s[1]/st[i-1][1]*100)+'%':''}</text>`}).join('')}</svg>`}
