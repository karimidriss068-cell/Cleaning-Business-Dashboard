name: CI

on:
  push:
    branches: [main, cleaning-platform]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only: the build inlines these but never calls Supabase.
      # No real keys live in CI (CLAUDE.md rule 2).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test in a far-off time zone (helpers must not depend on the machine's zone)
        run: npm test
        env:
          TZ: Pacific/Kiritimati
      - name: Build
        run: npm run build
